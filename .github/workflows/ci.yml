name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Check Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --locked

      - name: Run tests
        run: cargo test --locked