name: CI

on:
  workflow_dispatch:

concurrency:
  group: oxidrop-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Check Rust
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --locked

      - name: Run tests
        run: cargo test --locked