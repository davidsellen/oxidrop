name: Publish Oxidrop image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: oxidrop-publish-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read version from Cargo.toml
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]

          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Expected a stable Cargo version (MAJOR.MINOR.PATCH).")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"number={version}", file=output)
          PY

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish a new version
        env:
          OXIDROP_VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$image:$OXIDROP_VERSION"

          if result=$(docker buildx imagetools inspect "$tag" 2>&1); then
            echo "::error::Image tag $tag already exists. Bump the Cargo version before publishing."
            exit 1
          fi
          if ! grep -Eiq 'manifest unknown|: not found[[:space:]]*$' <<< "$result"; then
            printf '%s\n' "$result" >&2
            echo "::error::Could not confirm that $tag is available for publication."
            exit 1
          fi

          metadata="$RUNNER_TEMP/oxidrop-image-metadata.json"
          docker buildx build --platform linux/amd64 --push \
            --tag "$tag" --metadata-file "$metadata" .
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$metadata")

          printf 'Published: %s\nBicep image: %s@%s\n' "$tag" "$image" "$digest"
          printf '### Published Oxidrop %s\n\n`%s@%s`\n' \
            "$OXIDROP_VERSION" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
